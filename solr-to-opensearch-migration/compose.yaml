# Migration from Solr 6 to Alfresco Search Community (OpenSearch), in a single Compose file.
#
# Both phases are driven by environment variables, so the file itself never needs editing:
#
#   Phase 1 (Solr and OpenSearch side by side, history catch-up) -> defaults
#   Phase 2 (Solr stopped, OpenSearch in steady state)           -> MAX_GAP_AGE=24h SOLR_TRACKING=false
#
# Tags come from ../.env (symlinked as ./.env). See README.md for the operating sequence.

services:

  postgres:
    image: postgres:${POSTGRES_TAG}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:${TRANSFORM_TAG}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  alfresco:
    image: alfresco/alfresco-content-repository-community:${ALFRESCO_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy
    environment:
      # Product defaults for the metadata keystore, not secrets to protect.
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=${DB_USER}
        -Ddb.password=${DB_PASSWORD}
        -Ddb.url=jdbc:postgresql://postgres:5432/${DB_NAME}
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.host=opensearch
        -Delasticsearch.port=9200
        -Delasticsearch.indexName=alfresco
        -Delasticsearch.createIndexIfNotExists=true
        -Dsearch.solrTrackingSupport.enabled=${SOLR_TRACKING:-true}
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.base.url=/solr
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=${SHARED_SECRET}
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dcsrf.filter.enabled=false
        -Dalfresco.restApi.basicAuthScheme=true
    # Content lives on a volume: phase 2 recreates this container, and without a volume
    # alf_data would be lost while the database still references it.
    volumes:
      - alf-data:/usr/local/tomcat/alf_data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 2m

  # --- Old engine: stays alive and current through phase 1, as the rollback target ---

  solr6:
    image: alfresco/alfresco-search-services:${SEARCH_SERVICES_TAG}
    environment:
      SOLR_ALFRESCO_HOST: alfresco
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: solr6
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      ALFRESCO_SECURE_COMMS: secret
      JAVA_TOOL_OPTIONS: -Dalfresco.secureComms.secret=${SHARED_SECRET}
    volumes:
      - solr-data:/opt/alfresco-search-services/data
    ports:
      - "8083:8983"

  # --- New engine ---

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_TAG}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m

  # Cursor seeding. Without this the batch indexer starts at "now" and never indexes the
  # history already present in the repository.
  #
  # The cursor is computed from the database itself: MIN(commit_time_ms) of alf_transaction,
  # that is, the first real transaction of the repository. It is the same column the indexer
  # walks window by window, so catch-up takes time in proportion to the history that
  # actually exists. Seeding a fixed, much earlier date (2020, say) forces the indexer to
  # walk years of empty windows, one per cycle, with no documents to index.
  #
  # Uses _create, so an existing cursor is never overwritten and a migration already in
  # progress does not restart from the beginning.
  cursor-seed:
    image: alpine:3.20
    depends_on:
      opensearch:
        condition: service_healthy
      # Waits for Alfresco because the query needs the repository schema (alf_transaction).
      # In a real migration the schema already exists; in this demo Alfresco creates it on
      # first start.
      alfresco:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      SEED_EPOCH_MS: ${SEED_EPOCH_MS:-}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache --quiet postgresql-client curl
        seed=$${SEED_EPOCH_MS:-}
        if [ -z "$$seed" ]; then
          seed=$$(psql -h postgres -U "$$DB_USER" -d "$$DB_NAME" -tAc \
            "SELECT COALESCE(MIN(commit_time_ms), -1) FROM alf_transaction;")
        fi
        if [ "$$seed" -lt 0 ]; then
          echo "Repository has no transactions: no history to seed."
          exit 0
        fi
        # One millisecond earlier than the first transaction, so the initial window
        # includes it.
        seed=$$((seed - 1))
        curl -s -o /dev/null -X PUT "http://opensearch:9200/alfresco-reindex-state" \
          -H 'Content-Type: application/json' \
          -d '{"settings":{"index.hidden":true}}'
        code=$$(curl -s -o /dev/null -w '%{http_code}' \
          -X PUT "http://opensearch:9200/alfresco-reindex-state/_create/reindexByDate-watermark" \
          -H 'Content-Type: application/json' \
          -d "{\"schemaVersion\":1,\"lastSuccessfulToTimeEpochMs\":$$seed,\"lastRunStatus\":\"SEEDED\"}")
        case "$$code" in
          201) echo "Cursor seeded at $$seed" ;;
          409) echo "Cursor already exists, keeping it" ;;
          *)   echo "Failed to seed the cursor (HTTP $$code)"; exit 1 ;;
        esac

  batch-indexer:
    image: alfresco/alfresco-elasticsearch-batch-indexing:${BATCH_INDEXER_TAG}
    depends_on:
      alfresco:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      cursor-seed:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_ELASTICSEARCH_REST_URIS: http://opensearch:9200
      ELASTICSEARCH_INDEXNAME: alfresco
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: ${SHARED_SECRET}
      # Phase 1: 0 disables the gap age limit, so the seeded cursor is not discarded and
      # the whole history is processed in maxWindow chunks. Phase 2: 24h, the steady-state
      # value.
      ALFRESCO_REINDEX_CONTINUOUS_MAXGAPAGE: ${MAX_GAP_AGE:-0}
      # Catch-up processes one window per cycle. With the cursor seeded at the repository's
      # first real transaction, 30m (the steady-state value) is enough to recover a demo
      # repository's history in a handful of cycles. To migrate years of history, raise the
      # window (MAX_WINDOW=7d for example) so a cycle is not spent on every half hour of
      # calendar time.
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: ${MAX_WINDOW:-30m}
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: 15s
      ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL: 1s
    ports:
      - "8091:8080"

volumes:
  db-data:
  alf-data:
  opensearch-data:
  solr-data:
